spring.application.name=lanzador-api

# Valores reales en el archivo .env de esta carpeta (no versionado). Ver .env.example
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ---------- Microsoft Entra ID: HABILITADO ----------
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_API_CLIENT_ID}
# Rol de aplicación (App Role) exigido para disparar solicitudes
lanzador.rol-requerido=${ROL_REQUERIDO:Admin}

# ---------- Proyecto EP2 en AWS (IP públicas: cambian al reiniciar el Learner Lab) ----------
mesatech.catalogo.url=${CATALOGO_URL}
mesatech.solicitudes.url=${SOLICITUDES_URL}

logging.level.cl.duoc.mesatech=INFO
