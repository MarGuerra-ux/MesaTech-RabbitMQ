spring.application.name=solicitudes-service

# Variables reales en el archivo .env de esta carpeta (no versionado). Ver .env.example
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8082}

# ---------- RDS Solicitudes (instancia exclusiva: mesatech-rds-solicitudes) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
# Las tablas se crean con sql/solicitudes.sql (mecanismo documentado)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- RabbitMQ (EC2 C) - usuario consumidor ----------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s
# AUTO: Spring envía el ack solo cuando el listener retorna sin excepción (después de guardar en RDS).
# Si el guardado falla, la excepción se propaga y el mensaje vuelve a la cola (nack + requeue).
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=true
# Un mensaje a la vez: facilita observar Ready / Unacked durante las pruebas
spring.rabbitmq.listener.simple.prefetch=1
# Permite arrancar Solicitudes aunque el broker no esté disponible (reintenta la conexión)
spring.rabbitmq.listener.simple.missing-queues-fatal=false

mesatech.rabbitmq.queue=${RABBITMQ_QUEUE:solicitudes.catalogo.queue}
# Demora por mensaje para la demo del lanzador (ms). 0 = sin demora. Se ajusta en .env y se reinicia el servicio.
mesatech.consumer.delay-ms=${CONSUMER_DELAY_MS:0}

logging.level.cl.duoc.mesatech=INFO
