spring.application.name=catalogo-service

# Variables reales en el archivo .env de esta carpeta (no versionado). Ver .env.example
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}

# ---------- RDS Catálogo (instancia exclusiva: mesatech-rds-catalogo) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
# Las tablas se crean con sql/catalogo.sql (mecanismo documentado)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- RabbitMQ (EC2 C) - usuario publicador ----------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}
spring.rabbitmq.connection-timeout=5s
# Confirmaciones del publicador (ack/nack del broker) correlacionadas por eventId
spring.rabbitmq.publisher-confirm-type=correlated
# Retornos: el broker devuelve el mensaje si no existe ruta exchange -> cola
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

mesatech.rabbitmq.exchange=${RABBITMQ_EXCHANGE:catalogo.exchange}
mesatech.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:categoria.creada}
mesatech.rabbitmq.confirm-timeout-ms=5000

logging.level.cl.duoc.mesatech=INFO
