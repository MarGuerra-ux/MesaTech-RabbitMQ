spring.application.name=bff

# Variables reales en el archivo .env de esta carpeta (no versionado). Ver .env.example
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# ---------- Microsoft Entra ID (igual que la guía del profesor) ----------
# Id. de directorio (inquilino) -> token v2.0
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
# Id. de aplicación de la API expuesta (api-cloud-native)
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_API_CLIENT_ID}

# ---------- Microservicios ----------
# Catálogo corre en la misma EC2 A
mesatech.catalogo.url=${CATALOGO_URL:http://localhost:8081}
# Solicitudes corre en la EC2 B (IP privada)
mesatech.solicitudes.url=${SOLICITUDES_URL}

# Orígenes permitidos por CORS (separados por coma)
mesatech.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.cl.duoc.mesatech=INFO
logging.level.org.springframework.security=INFO
